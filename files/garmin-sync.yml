name: garmin-sync

# Runs the Garmin pull every morning in the cloud (Path A).
# Copy this file into .github/workflows/ in your own repo.

on:
  schedule:
    # 12:00 UTC = 06:00 in central Mexico (UTC-6, no DST). Cron is always UTC.
    - cron: "0 12 * * *"
  workflow_dispatch:      # lets you click "Run workflow" manually
    inputs:
      days:
        description: "How many days back to pull (e.g. 30 to backfill history)"
        required: false
        default: "3"

permissions:
  contents: write  # needed if you commit the garmin/ folder back (files sink)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # garminconnect >=0.3.3 (which has the widget login flow) needs 3.12+
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r files/requirements.txt

      - name: Pull Garmin data
        env:
          # Base64 token bundle printed by `python sync_garmin.py --login`.
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
          # Only needed for --sink supabase:
          GARMIN_INGEST_URL: ${{ secrets.GARMIN_INGEST_URL }}
          GARMIN_INGEST_SECRET: ${{ secrets.SESSION_LOG_SECRET }}
        run: |
          # Scheduled runs pull 3 days; a manual run can pass a bigger number.
          # For the database path, swap files for supabase below.
          python files/sync_garmin.py --days "${{ github.event.inputs.days || '3' }}" --sink files --out ./garmin

      - name: Commit updated data (files sink only)
        run: |
          if [ -d garmin ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f garmin
            git diff --staged --quiet || git commit -m "Garmin sync $(date -u +%Y-%m-%d)"
            git push
          fi
