<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Mi panel de rendimiento</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#faf9f7; --card:#ffffff; --ink:#3a3734; --muted:#a7a29c; --line:#efeae4;
    --run:#9fd0ab; --bike:#a6c8ec; --swim:#c4b6e6; --other:#f3c9a3;
    --coral:#f2a9a9; --sleep:#bcc7ea; --hrv:#a9dccb; --ready:#d0bde8; --rose:#e9b9c1;
    --shadow:0 1px 3px rgba(60,50,40,.05), 0 6px 20px rgba(60,50,40,.04);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    font-weight:400; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1080px; margin:0 auto; padding:28px 20px 80px; }
  header h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:13px; margin-top:4px; }
  .chips { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:999px;
          padding:5px 12px; font-size:12px; color:var(--ink); box-shadow:var(--shadow); }
  .chip b { font-weight:600; }

  h2.section { font-size:13px; text-transform:uppercase; letter-spacing:.08em;
               color:var(--muted); font-weight:600; margin:38px 0 14px; }

  /* Predictions hero */
  .hero { background:var(--card); border:1px solid var(--line); border-radius:22px;
          padding:26px; box-shadow:var(--shadow); }
  .pred-main { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;
               cursor:pointer; border-radius:14px; padding:8px; margin:-8px; transition:background .15s; }
  .pred-main:hover { background:#faf7f3; }
  .pred-main .lbl { font-size:14px; color:var(--muted); }
  .pred-main .big { font-size:52px; font-weight:700; letter-spacing:-.02em; line-height:1;
                    color:#5a5450; }
  .pred-main .pace { font-size:13px; color:var(--muted); }
  .pred-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:22px; }
  .pill { background:#faf8f5; border:1px solid var(--line); border-radius:16px; padding:14px;
          cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .pill:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
  .pill .lbl { font-size:12px; color:var(--muted); }
  .pill .val { font-size:24px; font-weight:600; margin-top:3px; color:#5a5450; }
  .pill .hint { font-size:11px; color:var(--muted); margin-top:2px; }
  .tri-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .tri { background:linear-gradient(135deg,#f7f4ff,#f3f8ff); border:1px solid var(--line);
         border-radius:16px; padding:16px; cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .tri:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
  .tri .lbl { font-size:12px; color:#8a83b0; font-weight:600; }
  .tri .val { font-size:28px; font-weight:700; margin-top:4px; color:#5a5480; }
  .tri .hint { font-size:11px; color:var(--muted); margin-top:3px; }

  .cards { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .metric { background:var(--card); border:1px solid var(--line); border-radius:16px;
            padding:15px 16px; box-shadow:var(--shadow); }
  .metric .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .metric .val { font-size:26px; font-weight:600; margin-top:4px; }
  .metric .val small { font-size:13px; color:var(--muted); font-weight:400; }

  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:18px;
           padding:16px 18px; box-shadow:var(--shadow); }
  .panel h3 { margin:0 0 12px; font-size:14px; font-weight:600; }
  canvas { max-height:250px; }

  .insights p { margin:0 0 10px; font-size:14px; }
  .insights .tag { display:inline-block; width:8px; height:8px; border-radius:50%;
                   margin-right:8px; vertical-align:middle; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .sportdot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; }

  .coach { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .coach .panel .big { font-size:30px; font-weight:700; }
  .coach .desc { font-size:12px; color:var(--muted); margin-top:6px; }
  .bar-track { height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:10px; }
  .bar-fill { height:100%; border-radius:6px; }

  #err { display:none; background:#fff4f4; border:1px solid #f3d4d4; color:#a55;
         padding:16px; border-radius:14px; }

  /* Modal */
  .backdrop { position:fixed; inset:0; background:rgba(50,44,40,.35); display:none;
              align-items:center; justify-content:center; padding:20px; z-index:50; }
  .backdrop.open { display:flex; }
  .modal { background:var(--card); border-radius:20px; padding:24px; max-width:460px; width:100%;
           box-shadow:0 20px 60px rgba(0,0,0,.2); max-height:85vh; overflow:auto; }
  .modal h3 { margin:0 0 4px; font-size:20px; }
  .modal .msub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .modal .rowline { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line);
                    font-size:14px; }
  .modal .rowline span:last-child { font-weight:600; }
  .modal .note { font-size:12px; color:var(--muted); margin-top:14px; line-height:1.5; }
  .modal .close { float:right; cursor:pointer; color:var(--muted); font-size:20px; line-height:1;
                  border:none; background:none; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏅 Mi panel de rendimiento</h1>
    <div class="sub" id="updated">Cargando…</div>
    <div class="chips" id="chips"></div>
  </header>

  <div id="err"></div>

  <!-- PREDICTIONS -->
  <h2 class="section">Predicciones de carrera</h2>
  <div class="hero" id="hero"></div>

  <!-- INSIGHTS -->
  <h2 class="section">Qué dicen tus datos</h2>
  <div class="panel insights" id="insights"></div>

  <!-- TODAY -->
  <h2 class="section">Hoy</h2>
  <div class="cards" id="today"></div>

  <!-- TRAINING -->
  <h2 class="section">Entrenamiento semanal</h2>
  <div class="grid" id="training"></div>

  <!-- COACHING -->
  <h2 class="section">Marcos de entrenamiento</h2>
  <div class="coach" id="coach"></div>

  <!-- WELLNESS -->
  <h2 class="section">Recuperación</h2>
  <div class="grid" id="wellness"></div>

  <!-- ACTIVITIES -->
  <h2 class="section">Últimos entrenamientos</h2>
  <div class="panel">
    <table id="acts"><thead><tr>
      <th>Fecha</th><th>Actividad</th><th>Dur</th><th>Dist</th><th>Ritmo/vel</th><th>HR</th><th>D+</th>
    </tr></thead><tbody></tbody></table>
  </div>
</div>

<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>

<script>
const C = { run:"#7fc490", bike:"#8fb8e6", swim:"#b5a3e0", other:"#f0b98a",
            coral:"#ef9e9e", sleep:"#a9b8e6", hrv:"#8fd3bd", ready:"#c3a9e6", rose:"#e2a3ae" };

/* ---------- helpers ---------- */
const num = (n,d=0)=> (n==null||Number.isNaN(n))?null:Number(n);
const fmt = (n,d=0)=> (n==null||Number.isNaN(n))?"—":Number(n).toLocaleString("es-MX",{maximumFractionDigits:d});
function fmtTime(sec){ if(!sec) return "—"; sec=Math.round(sec);
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h>0 ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
             : `${m}:${String(s).padStart(2,"0")}`; }
function fmtPace(secPerKm){ if(!secPerKm) return "—"; const m=Math.floor(secPerKm/60), s=Math.round(secPerKm%60);
  return `${m}:${String(s).padStart(2,"0")}/km`; }
function mondayOf(dateStr){ const d=new Date(dateStr.slice(0,10)+"T00:00:00");
  const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const weekLabel = k => { const [y,m,d]=k.split("-"); return `${d}/${m}`; };
function sportOf(type){ type=(type||"").toLowerCase();
  if(/run|treadmill/.test(type)) return "run";
  if(/cycl|bik|ride/.test(type)) return "bike";
  if(/swim/.test(type)) return "swim";
  return "other"; }

let STORE=null;
const baseChartOpts = (extra={}) => ({
  responsive:true, maintainAspectRatio:false,
  plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:"#4a4440" } },
  scales:{ x:{ grid:{display:false}, ticks:{color:"#a7a29c",maxRotation:0,autoSkip:true,maxTicksLimit:8} },
           y:{ grid:{color:"#f0ece7"}, ticks:{color:"#a7a29c"}, beginAtZero:true } },
  ...extra });

function lineChart(el,labels,data,color){
  new Chart(el,{ type:"line", data:{ labels, datasets:[{ data, borderColor:color,
    backgroundColor:color+"33", tension:.35, fill:true, pointRadius:2, borderWidth:2, spanGaps:true }]},
    options: baseChartOpts({scales:{x:{grid:{display:false},ticks:{color:"#a7a29c",maxRotation:0,autoSkip:true,maxTicksLimit:8}},
      y:{grid:{color:"#f0ece7"},ticks:{color:"#a7a29c"},beginAtZero:false}}}) });
}
function barChart(el,labels,datasets,stacked){
  new Chart(el,{ type:"bar", data:{ labels, datasets },
    options: baseChartOpts({ plugins:{legend:{display:datasets.length>1, labels:{color:"#7a736c",boxWidth:10,font:{size:11}}},
      tooltip:{backgroundColor:"#4a4440"}},
      scales:{ x:{ stacked, grid:{display:false}, ticks:{color:"#a7a29c"} },
               y:{ stacked, grid:{color:"#f0ece7"}, ticks:{color:"#a7a29c"}, beginAtZero:true } } }) });
}

/* ---------- predictions ---------- */
function riegel(t1,d1,d2){ return t1 * Math.pow(d2/d1, 1.06); }
function runPredictions(acts, fitness){
  const rp = (fitness&&fitness.race_pred)||{};
  let src="Garmin", p={ 5:rp.sec_5k, 10:rp.sec_10k, 21.0975:rp.sec_half, 42.195:rp.sec_marathon };
  const have = Object.values(p).some(Boolean);
  if(!have){
    // Riegel fallback from the best recent run (>=3 km)
    const runs = acts.filter(a=>sportOf(a.type)==="run" && a.distance_km>=3 && a.duration_min);
    if(runs.length){
      let best=null;
      for(const r of runs){ const pace=r.duration_min*60/r.distance_km; if(!best||pace<best.pace) best={pace,r}; }
      const t1=best.r.duration_min*60, d1=best.r.distance_km;
      p={ 5:riegel(t1,d1,5), 10:riegel(t1,d1,10), 21.0975:riegel(t1,d1,21.0975), 42.195:riegel(t1,d1,42.195) };
      src="Estimado (fórmula de Riegel, tu mejor carrera reciente)";
    } else { src=null; }
  }
  return { p, src };
}
function medianSpeed(acts, sport){
  const v = acts.filter(a=>sportOf(a.type)===sport && a.avg_speed_kmh).map(a=>a.avg_speed_kmh).sort((a,b)=>a-b);
  return v.length ? v[Math.floor(v.length/2)] : null;
}
function ironman(acts, runP){
  // returns {mode: {swim,bike,run,trans,total, assumptions[]}}
  function calc(swimKm,bikeKm,runKm,cfg){
    const a=[];
    let swimKmh=medianSpeed(acts,"swim"); if(!swimKmh){ swimKmh=2.77; a.push("Natación: sin datos, asumí 2:10/100m"); }
    let bikeKmh=medianSpeed(acts,"bike"); if(!bikeKmh){ bikeKmh=30; a.push("Ciclismo: sin datos, asumí 30 km/h"); }
    const bikeSust = bikeKmh*cfg.bikeFactor;         // sustainable IM effort < short-ride avg
    let runPaceKm = runP && runP[cfg.runRef] ? runP[cfg.runRef]/cfg.runRefKm : null;
    if(!runPaceKm){ runPaceKm=6*60; a.push("Carrera: sin predicción, asumí 6:00/km"); }
    runPaceKm *= cfg.runPenalty;                     // off-the-bike fatigue
    const swim = (swimKm/swimKmh)*3600;              // seconds
    const bike = (bikeKm/bikeSust)*3600;
    const run  = runKm*runPaceKm;
    const trans = cfg.trans;
    return { swim, bike, run, trans, total:swim+bike+run+trans, a, swimKmh, bikeSust, runPaceKm };
  }
  return {
    full: calc(3.8,180,42.195,{bikeFactor:0.82, runRef:42.195, runRefKm:42.195, runPenalty:1.14, trans:12*60}),
    half: calc(1.9,90,21.0975,{bikeFactor:0.90, runRef:21.0975, runRefKm:21.0975, runPenalty:1.08, trans:8*60}),
  };
}

/* ---------- modal ---------- */
function openModal(html){ document.getElementById("modal").innerHTML=html;
  document.getElementById("backdrop").classList.add("open"); }
function closeModal(){ document.getElementById("backdrop").classList.remove("open"); }
document.getElementById("backdrop").addEventListener("click",e=>{ if(e.target.id==="backdrop") closeModal(); });

function runModal(dist,label,sec,src){
  const pace = sec/dist;
  openModal(`<button class="close" onclick="closeModal()">×</button>
    <h3>${label}</h3><div class="msub">Predicción de tiempo</div>
    <div class="rowline"><span>Tiempo objetivo</span><span>${fmtTime(sec)}</span></div>
    <div class="rowline"><span>Ritmo</span><span>${fmtPace(pace)}</span></div>
    <div class="rowline"><span>Distancia</span><span>${dist} km</span></div>
    <div class="rowline"><span>Velocidad</span><span>${fmt(3600/pace,1)} km/h</span></div>
    <div class="note"><b>Fuente:</b> ${src||"—"}.<br>
    Las predicciones asumen buen descanso, terreno plano y buen clima. Úsalas como referencia, no como garantía.</div>`);
}
function imModal(key,m){
  const title = key==="full" ? "Ironman completo" : "Ironman 70.3";
  const dist = key==="full" ? "3.8 km nado · 180 km bici · 42.2 km carrera" : "1.9 km nado · 90 km bici · 21.1 km carrera";
  const notes = m.a.length ? m.a.map(x=>"• "+x).join("<br>") : "Todos los segmentos usan tus datos reales recientes.";
  openModal(`<button class="close" onclick="closeModal()">×</button>
    <h3>${title}</h3><div class="msub">${dist}</div>
    <div class="rowline"><span>🏊 Natación</span><span>${fmtTime(m.swim)}</span></div>
    <div class="rowline"><span>🚴 Ciclismo</span><span>${fmtTime(m.bike)}</span></div>
    <div class="rowline"><span>🏃 Carrera</span><span>${fmtTime(m.run)}</span></div>
    <div class="rowline"><span>🔁 Transiciones</span><span>${fmtTime(m.trans)}</span></div>
    <div class="rowline" style="border:none"><span><b>Total estimado</b></span><span><b>${fmtTime(m.total)}</b></span></div>
    <div class="note"><b>Estimación aproximada.</b> Se calcula con el ritmo sostenible de cada deporte (bici y carrera ajustadas por fatiga de larga distancia) más transiciones.<br><br><b>Supuestos:</b><br>${notes}</div>`);
}

/* ---------- main render ---------- */
async function load(){
  let s;
  try{ const r=await fetch("garmin/data.json",{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); s=await r.json(); }
  catch(e){ const b=document.getElementById("err"); b.style.display="block";
    b.innerHTML="No pude cargar <code>garmin/data.json</code> ("+e.message+"). Si lo abriste con doble clic, usa un servidor local: <code>python3 -m http.server 8000</code>.";
    document.getElementById("updated").textContent=""; return; }
  STORE=s;

  const wellness=Object.values(s.wellness||{}).sort((a,b)=>a.date.localeCompare(b.date));
  const acts=Object.values(s.activities||{}).sort((a,b)=>String(b.start).localeCompare(String(a.start)));
  const fitness=s.fitness||{};
  const last=wellness[wellness.length-1]||{};

  document.getElementById("updated").textContent =
    `Actualizado: ${s.updated_at?new Date(s.updated_at).toLocaleString("es-MX"):"—"} · ${wellness.length} días · ${acts.length} entrenamientos`;

  // chips (VO2max)
  const chips=[];
  if(fitness.vo2max_run) chips.push(`<span class="chip">VO₂max carrera <b>${fmt(fitness.vo2max_run,1)}</b></span>`);
  if(fitness.vo2max_bike) chips.push(`<span class="chip">VO₂max bici <b>${fmt(fitness.vo2max_bike,1)}</b></span>`);
  document.getElementById("chips").innerHTML=chips.join("");

  /* ---- predictions ---- */
  const { p, src } = runPredictions(acts, fitness);
  const im = ironman(acts, p);
  const marathon = p[42.195];
  document.getElementById("hero").innerHTML = `
    <div class="pred-main" id="pm">
      <div><div class="lbl">Maratón (42.2 km)</div>
        <div class="big">${fmtTime(marathon)}</div>
        <div class="pace">${marathon?fmtPace(marathon/42.195):""} ${src?"· "+ (src.startsWith("Garmin")?"predicción Garmin":"estimado"):""}</div></div>
    </div>
    <div class="pred-row">
      <div class="pill" data-d="21.0975" data-l="Medio maratón"><div class="lbl">½ Maratón · 21.1 km</div><div class="val">${fmtTime(p[21.0975])}</div><div class="hint">${p[21.0975]?fmtPace(p[21.0975]/21.0975):"—"}</div></div>
      <div class="pill" data-d="10" data-l="10K"><div class="lbl">10K</div><div class="val">${fmtTime(p[10])}</div><div class="hint">${p[10]?fmtPace(p[10]/10):"—"}</div></div>
      <div class="pill" data-d="5" data-l="5K"><div class="lbl">5K</div><div class="val">${fmtTime(p[5])}</div><div class="hint">${p[5]?fmtPace(p[5]/5):"—"}</div></div>
    </div>
    <div class="tri-row">
      <div class="tri" id="imfull"><div class="lbl">🏊🚴🏃 Ironman completo</div><div class="val">${fmtTime(im.full.total)}</div><div class="hint">estimación · toca para ver desglose</div></div>
      <div class="tri" id="imhalf"><div class="lbl">🏊🚴🏃 Ironman 70.3</div><div class="val">${fmtTime(im.half.total)}</div><div class="hint">estimación · toca para ver desglose</div></div>
    </div>`;
  document.getElementById("pm").onclick=()=>marathon&&runModal(42.195,"Maratón",marathon,src);
  document.querySelectorAll(".pill").forEach(el=>el.onclick=()=>{ const d=parseFloat(el.dataset.d);
    if(p[d]) runModal(d,el.dataset.l,p[d],src); });
  document.getElementById("imfull").onclick=()=>imModal("full",im.full);
  document.getElementById("imhalf").onclick=()=>imModal("half",im.half);

  /* ---- weekly aggregates ---- */
  const weeks={};
  for(const a of acts){ if(!a.start) continue; const k=mondayOf(a.start);
    const w=weeks[k]||(weeks[k]={run:0,bike:0,swim:0,other:0,runH:0,bikeH:0,swimH:0,otherH:0,vert:0,load:0});
    const sp=sportOf(a.type), h=(a.duration_min||0)/60;
    if(sp==="run") w.run+=a.distance_km||0; if(sp==="bike") w.bike+=a.distance_km||0; if(sp==="swim") w.swim+=a.distance_km||0;
    w[sp+"H"]+=h; w.vert+=a.elevation_gain_m||0; w.load+=a.training_load||0; }
  const wk=Object.keys(weeks).sort().slice(-10);
  const L=wk.map(weekLabel);
  const ds=(get,color,label)=>({label,data:wk.map(k=>+get(weeks[k]).toFixed(1)),backgroundColor:color,borderRadius:6,borderSkipped:false});

  document.getElementById("training").innerHTML=`
    <div class="panel"><h3>Kilómetros de carrera por semana</h3><canvas id="c_runkm"></canvas></div>
    <div class="panel"><h3>Volumen por deporte (km)</h3><canvas id="c_vol"></canvas></div>
    <div class="panel"><h3>Horas por deporte</h3><canvas id="c_hrs"></canvas></div>
    <div class="panel"><h3>Desnivel acumulado (m)</h3><canvas id="c_vert"></canvas></div>
    <div class="panel"><h3>HR vs ritmo (carreras)</h3><canvas id="c_hrpace"></canvas></div>
    <div class="panel"><h3>Carga de entrenamiento semanal</h3><canvas id="c_load"></canvas></div>`;
  barChart(document.getElementById("c_runkm"),L,[ds(w=>w.run,C.run,"km")],false);
  barChart(document.getElementById("c_vol"),L,[ds(w=>w.run,C.run,"Carrera"),ds(w=>w.bike,C.bike,"Bici"),ds(w=>w.swim,C.swim,"Nado")],true);
  barChart(document.getElementById("c_hrs"),L,[ds(w=>w.runH,C.run,"Carrera"),ds(w=>w.bikeH,C.bike,"Bici"),ds(w=>w.swimH,C.swim,"Nado"),ds(w=>w.otherH,C.other,"Otro")],true);
  barChart(document.getElementById("c_vert"),L,[ds(w=>w.vert,C.other,"m")],false);
  barChart(document.getElementById("c_load"),L,[ds(w=>w.load,C.ready,"carga")],false);

  // HR vs pace scatter (running)
  const pts=acts.filter(a=>sportOf(a.type)==="run"&&a.avg_hr&&a.avg_speed_kmh)
    .map(a=>({x:+(3600/a.avg_speed_kmh/60).toFixed(2), y:a.avg_hr, name:(a.name||"Carrera")+" "+String(a.start).slice(0,10)}));
  new Chart(document.getElementById("c_hrpace"),{ type:"scatter",
    data:{ datasets:[{ data:pts, backgroundColor:C.coral, pointRadius:5 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ backgroundColor:"#4a4440",
        callbacks:{ label:c=>`${c.raw.name}: ${Math.floor(c.raw.x)}:${String(Math.round((c.raw.x%1)*60)).padStart(2,"0")}/km · ${c.raw.y} bpm` } } },
      scales:{ x:{ title:{display:true,text:"Ritmo (min/km)",color:"#a7a29c"}, grid:{color:"#f0ece7"}, ticks:{color:"#a7a29c"} },
               y:{ title:{display:true,text:"HR media (bpm)",color:"#a7a29c"}, grid:{color:"#f0ece7"}, ticks:{color:"#a7a29c"} } } } });

  /* ---- coaching frameworks ---- */
  const dayLoad={}; for(const a of acts){ if(a.start&&a.training_load) dayLoad[a.start.slice(0,10)]=(dayLoad[a.start.slice(0,10)]||0)+a.training_load; }
  const today=new Date(); const dstr=d=>d.toISOString().slice(0,10);
  let acute=0,chronic=0; for(let i=0;i<28;i++){ const d=new Date(today); d.setDate(d.getDate()-i); const v=dayLoad[dstr(d)]||0; chronic+=v; if(i<7) acute+=v; }
  const acwr = chronic>0 ? acute/(chronic/4) : null;
  const acwrZone = acwr==null?["—","var(--muted)","Sin datos de carga suficientes."]
    : acwr<0.8?["Bajo","#8fb8e6","Estás por debajo de tu carga habitual: margen para subir gradualmente."]
    : acwr<=1.3?["Óptimo","#7fc490","Zona ideal (0.8–1.3): progresión sostenible y bajo riesgo."]
    : acwr<=1.5?["Elevado","#f0b98a","Subiendo rápido: cuida el descanso esta semana."]
    : ["Riesgo","#ef9e9e","Salto de carga alto (>1.5): mayor riesgo de lesión, considera bajar."];

  // Polarized 80/20 (approx by avg HR vs observed max)
  const maxHR=Math.max(80,...acts.map(a=>a.max_hr||0));
  let easyH=0,hardH=0;
  for(const a of acts){ if(!a.avg_hr||!a.duration_min) continue; const h=a.duration_min/60;
    if(a.avg_hr < 0.81*maxHR) easyH+=h; else hardH+=h; }
  const totH=easyH+hardH, easyPct=totH?Math.round(easyH/totH*100):null;

  // weekly ramp (km)
  const kmSeries=wk.map(k=>weeks[k].run); const ramp = kmSeries.length>=2 && kmSeries[kmSeries.length-2]>0
    ? Math.round((kmSeries[kmSeries.length-1]/kmSeries[kmSeries.length-2]-1)*100) : null;

  document.getElementById("coach").innerHTML=`
    <div class="panel"><h3>Ratio carga aguda:crónica</h3>
      <div class="big" style="color:${acwrZone[1]}">${acwr?acwr.toFixed(2):"—"}</div>
      <div class="desc"><b>${acwrZone[0]}.</b> ${acwrZone[2]}</div></div>
    <div class="panel"><h3>Polarización (80/20)</h3>
      <div class="big">${easyPct!=null?easyPct+"%":"—"}<small class="muted" style="font-size:14px"> fácil</small></div>
      <div class="bar-track"><div class="bar-fill" style="width:${easyPct||0}%;background:${C.run}"></div></div>
      <div class="desc">Objetivo ~80% fácil / 20% fuerte. ${easyPct!=null?(easyPct>=75?"Buen equilibrio polarizado.":"Estás haciendo demasiada intensidad; suma más rodajes fáciles."):"Aprox. por HR media."}</div></div>
    <div class="panel"><h3>Rampa semanal (km carrera)</h3>
      <div class="big">${ramp!=null?(ramp>0?"+":"")+ramp+"%":"—"}</div>
      <div class="desc">Cambio vs semana previa. La regla clásica sugiere no subir más de ~10% por semana.</div></div>`;

  /* ---- insights text ---- */
  const ins=[];
  const rc = kmSeries.length>=2 ? kmSeries[kmSeries.length-1] : (kmSeries[0]||0);
  const rprev = kmSeries.length>=2 ? kmSeries[kmSeries.length-2] : null;
  if(rc!=null){ ins.push([C.run, `Corriste <b>${fmt(rc,1)} km</b> esta semana${rprev!=null?` (${ramp>0?"+":""}${ramp}% vs la anterior)`:""}.`]); }
  const rec=n=>wellness.slice(-n);
  const avg=(arr,k)=>{ const v=arr.map(x=>x[k]).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; };
  const sl=avg(rec(7),"sleep_hours"); if(sl) ins.push([C.sleep, `Dormiste en promedio <b>${fmt(sl,1)} h</b> los últimos 7 días.`]);
  const h7=avg(rec(7),"hrv_overnight"), h14=avg(rec(14).slice(0,7),"hrv_overnight");
  if(h7&&h14){ const diff=h7-h14, word=diff>=0.5?"al alza":diff<=-0.5?"en descenso":"estable";
    ins.push([C.hrv, `Tu HRV va <b>${word}</b> (${fmt(h7,0)} ms vs ${fmt(h14,0)} ms la semana previa).`]); }
  if(last.training_readiness) ins.push([C.ready, `Tu readiness más reciente es <b>${fmt(last.training_readiness)}</b>/100.`]);
  if(acwr) ins.push([acwrZone[1], `Tu carga aguda:crónica está en <b>${acwr.toFixed(2)}</b> — ${acwrZone[0].toLowerCase()}.`]);
  if(marathon) ins.push([C.rose, `Tu ritmo de maratón proyectado es <b>${fmtPace(marathon/42.195)}</b>.`]);
  document.getElementById("insights").innerHTML = ins.length
    ? ins.map(([c,t])=>`<p><span class="tag" style="background:${c}"></span>${t}</p>`).join("")
    : `<p class="muted">Aún no hay suficientes datos. Deja que se acumulen unos días.</p>`;

  /* ---- today cards ---- */
  document.getElementById("today").innerHTML=[
    ["HR en reposo",fmt(last.resting_hr),"bpm"],["HRV nocturna",fmt(last.hrv_overnight),"ms"],
    ["Sueño",fmt(last.sleep_hours,1),"h"],["Readiness",fmt(last.training_readiness),"/100"],
    ["Estrés prom",fmt(last.stress_avg),""],["Pasos",fmt(last.steps),""],
  ].map(([l,v,u])=>`<div class="metric"><div class="lbl">${l}</div><div class="val">${v} <small>${u}</small></div></div>`).join("");

  /* ---- wellness trends ---- */
  const wl=wellness.map(w=>w.date.slice(5));
  document.getElementById("wellness").innerHTML=`
    <div class="panel"><h3>Sueño (h)</h3><canvas id="w_sleep"></canvas></div>
    <div class="panel"><h3>HRV nocturna (ms)</h3><canvas id="w_hrv"></canvas></div>
    <div class="panel"><h3>HR en reposo (bpm)</h3><canvas id="w_rhr"></canvas></div>
    <div class="panel"><h3>Training readiness</h3><canvas id="w_ready"></canvas></div>`;
  const pick=k=>wellness.map(w=>w[k]??null);
  lineChart(document.getElementById("w_sleep"),wl,pick("sleep_hours"),C.sleep);
  lineChart(document.getElementById("w_hrv"),wl,pick("hrv_overnight"),C.hrv);
  lineChart(document.getElementById("w_rhr"),wl,pick("resting_hr"),C.coral);
  lineChart(document.getElementById("w_ready"),wl,pick("training_readiness"),C.ready);

  /* ---- activities table ---- */
  const tb=document.querySelector("#acts tbody");
  tb.innerHTML=acts.slice(0,25).map(a=>{ const sp=sportOf(a.type);
    const paceOrVel = sp==="run"&&a.avg_speed_kmh ? fmtPace(3600/a.avg_speed_kmh)
      : a.avg_speed_kmh ? fmt(a.avg_speed_kmh,1)+" km/h" : "—";
    return `<tr>
      <td>${(a.start||"").slice(0,10)}</td>
      <td><span class="sportdot" style="background:${C[sp]}"></span>${a.name||a.type||"—"}</td>
      <td>${fmt(a.duration_min)} min</td>
      <td>${a.distance_km?fmt(a.distance_km,1)+" km":"—"}</td>
      <td>${paceOrVel}</td>
      <td>${a.avg_hr?fmt(a.avg_hr)+" bpm":"—"}</td>
      <td>${a.elevation_gain_m?fmt(a.elevation_gain_m)+" m":"—"}</td></tr>`;
  }).join("") || `<tr><td colspan="7" class="muted">Sin entrenamientos aún.</td></tr>`;
}
load();
</script>
</body>
</html>
